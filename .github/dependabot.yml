version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "UTC" }
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message: { prefix: "chore(deps)" }
    labels: ["type:chore", "area:build"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "UTC" }
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci(deps)" }
    labels: ["type:ci"]

  - package-ecosystem: "docker-compose"   # compose.yaml (and compose.prod.yaml from #53)
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "UTC" }
    cooldown:
      default-days: 3
    commit-message: { prefix: "chore(docker)" }
    labels: ["type:infra"]

  # The "docker" ecosystem (Dockerfile) is added together with the Dockerfile in #51: without one,
  # its weekly run fails with "No Dockerfiles nor Kubernetes YAML found".
