name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}   # deny everything by default; jobs opt in below

jobs:
  build:
    name: Build, Test & Verify          # ⚠️ keep this exact name: it's a required status check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read        # checkout
      checks: write         # JUnit report check run
      pull-requests: write  # JaCoCo PR comment
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, Test & Verify with Maven
        run: ./mvnw -B clean verify

      - name: Publish JUnit Test Results
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: '**/target/*-reports/TEST-*.xml'
          annotate_only: false
          check_name: 'JUnit Test Results'

      - name: Post JaCoCo Coverage Report to PR
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        if: always() && github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: 'JaCoCo Code Coverage'
          update-comment: true
          skip-if-no-changes: true

      - name: Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14
