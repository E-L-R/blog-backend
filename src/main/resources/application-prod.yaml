spring:
  jpa:
    show-sql: false

blog:
  jwt:
    issuer: ${BLOG_JWT_ISSUER:https://api.blog.example.com}
    access-token-ttl: ${BLOG_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${BLOG_JWT_REFRESH_TOKEN_TTL:7d}
  ai:
    enabled: ${BLOG_AI_ENABLED:true}
    model: ${BLOG_AI_MODEL:gpt-4o}
    timeout: ${BLOG_AI_TIMEOUT:30s}
  cors:
    allowed-origins: ${BLOG_CORS_ALLOWED_ORIGINS}
  rate-limit:
    enabled: true
    capacity: ${BLOG_RATE_LIMIT_CAPACITY:60}
    refill-tokens: ${BLOG_RATE_LIMIT_REFILL_TOKENS:60}
    refill-duration: ${BLOG_RATE_LIMIT_REFILL_DURATION:1m}

# API docs are a development tool: off in production unless explicitly enabled (#14).
springdoc:
  api-docs:
    enabled: ${BLOG_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${BLOG_API_DOCS_ENABLED:false}
