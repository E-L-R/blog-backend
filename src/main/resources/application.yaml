spring:
  application:
    name: blog
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks the mapping matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # write and read timestamps in UTC, whatever the server's time zone
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50   # load lazy collections of many parents in groups of 50 (#38)

blog:
  jwt:
    issuer: blog-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  ai:
    enabled: true
    model: gpt-4o-mini
    timeout: 30s
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    max-age: 1h
  rate-limit:
    enabled: true
    capacity: 60
    refill-tokens: 60
    refill-duration: 1m
