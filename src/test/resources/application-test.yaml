blog:
  jwt:
    issuer: blog-test
    access-token-ttl: 5m
    refresh-token-ttl: 1d
  ai:
    enabled: false
    model: test-model
    timeout: 5s
  cors:
    allowed-origins:
      - "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
    max-age: 1h
  rate-limit:
    enabled: false
    capacity: 100
    refill-tokens: 100
    refill-duration: 1m
